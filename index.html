<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can I Be Your VALentine? 💖</title>

<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    color: white;
}

.screen {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: opacity 0.8s ease;
}

.hidden {
    opacity: 0;
    pointer-events: none;
}

.container {
    background: rgba(255,255,255,0.2);
    padding: 40px;
    border-radius: 25px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    max-width: 420px;
}

h1 {
    font-size: 2rem;
}

.highlight {
    color: #fff700;
}

button {
    padding: 12px 25px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.primary {
    background-color: #ff4d6d;
    color: white;
}

.primary:hover {
    transform: scale(1.1);
}

.secondary {
    background-color: #555;
    color: white;
    position: relative;
}

#response {
    margin-top: 20px;
    font-size: 1.3rem;
}


.heart {
    position: absolute;
    color: rgba(255,255,255,0.6);
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
    }
    50% { opacity: 1; }
    to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
    }
}
</style>
</head>

<body>


<div class="screen" id="introScreen">
    <div class="container">
        <h1>Hey Val... 💕</h1>
        <p>I have a very important question for you (kahit na alam mo na kase nispoil ko).</p>
        <button class="primary" onclick="showMain()">Click to Continue 😌</button>
    </div>
</div>


<div class="screen hidden" id="mainScreen">
    <div class="container">
        <h1>Can I be your <span class="highlight">VAL</span>entine? 💖</h1>
        <p>I promise to make you happiii, warm hugs, and a lifetime supply of mwa :3.</p>

        <div>
            <button class="primary" id="yesBtn">Yes 💕</button>
            <button class="secondary" id="noBtn">No 😢</button>
        </div>

        <p id="response"></p>
    </div>
</div>

<script>
const introScreen = document.getElementById("introScreen");
const mainScreen = document.getElementById("mainScreen");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const response = document.getElementById("response");


function showMain() {
    introScreen.classList.add("hidden");
    mainScreen.classList.remove("hidden");
}


yesBtn.addEventListener("click", () => {
    response.innerHTML = "SHE SAID YES!!! 💖✨ Best decision ever, Val 😌";
    launchConfetti();
});


noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 300 - 150;
    const y = Math.random() * 300 - 150;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});


function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}
setInterval(createHeart, 500);


function launchConfetti() {
    for (let i = 0; i < 60; i++) {
        const confetti = document.createElement("div");
        confetti.innerHTML = "🎉";
        confetti.style.position = "absolute";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.fontSize = "22px";
        confetti.style.animation = "fall 3s linear forwards";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
    }
}

const style = document.createElement('style');
style.innerHTML = `
@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}`;
document.head.appendChild(style);
</script>
<body>


<iframe id="bgMusic" width="0" height="0"
src="https://www.youtube.com/embed/tyKu0uZS86Q?autoplay=1&loop=1&playlist=tyKu0uZS86Q&mute=1"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

</body>
</body>
</html>
